# XcodeGen spec for the Apple TV thin client. There is deliberately no
# .xcodeproj in the repo: `xcodegen generate` builds one from this file, so the
# project is reviewable as text and never produces a merge conflict nobody can
# read. See README.md ("Building it on a Mac") for the Mac-side steps.
#
# Generated by: xcodegen generate   (brew install xcodegen)

name: HalcyonRemote

options:
  bundleIdPrefix: video.halcyon
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    tvOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Fill this in on the Mac (Xcode > target > Signing & Capabilities picks it
    # up interactively too). Left empty so the checked-in file names nobody's
    # private team id.
    DEVELOPMENT_TEAM: ""
    # The WebRTC SDK is Objective-C and predates Swift concurrency, so its
    # delegate callbacks carry no isolation. `complete` checking would turn
    # every one of them into an error for no safety gained: this code hops to
    # the main queue explicitly at every boundary instead (see
    # PeerConnectionManager).
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  # stasel/WebRTC is the maintained binary distribution of Google's libwebrtc
  # Objective-C SDK as an XCFramework. VERSION RULE: the tags track Chromium
  # milestones (125.0.0, 130.0.0, ...) and each milestone bumps the MAJOR, so
  # `from:` would pin us to one milestone forever. A wide range lets SPM
  # resolve to the newest published build; pin it exactly once you have one
  # that works.
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    minVersion: 120.0.0
    maxVersion: 500.0.0

targets:
  HalcyonRemote:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      # Info.plist is GENERATED from the `info:` block below, so it must not
      # also be swept up as a resource — XcodeGen would copy it into the bundle
      # a second time.
      - path: HalcyonRemote
        excludes:
          - "Info.plist"
    dependencies:
      - package: WebRTC
    info:
      path: HalcyonRemote/Info.plist
      properties:
        CFBundleDisplayName: Halcyon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # tvOS 16 brought the local-network privacy prompt across from iOS.
        # Without this string the first connection to a LAN address is denied
        # with no visible reason.
        NSLocalNetworkUsageDescription: >-
          Halcyon connects to the computer on your network that is running your
          store. Nothing leaves your home network.
        # NSBonjourServices is deliberately ABSENT: the address is typed in at
        # setup, nothing here browses Bonjour. If a fresh install turns out to
        # need a Bonjour browse to trigger the permission prompt at all, see
        # the "could not verify" list in README.md.
        NSAppTransportSecurity:
          # The store server is a vite dev/preview server on the owner's LAN,
          # speaking plain http on port 1420 with no certificate to trust.
          # NSAllowsLocalNetworking alone covers RFC1918 literals and *.local,
          # but people type names like "halcyon.lan" too, hence the broader
          # exception. App Review will ask why: the answer is that this app
          # only ever talks to a server the user runs themselves, at an address
          # they typed in, and there is no remote endpoint to secure.
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: video.halcyon.remote
        TARGETED_DEVICE_FAMILY: "3"
        # No asset catalog is checked in, so no app icon is wired up: a build
        # signed for a device works fine without one. TestFlight/App Store does
        # NOT — see README.md ("Before TestFlight") for the step before upload.

  HalcyonRemoteTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: HalcyonRemoteTests
    dependencies:
      - target: HalcyonRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: video.halcyon.remote.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  HalcyonRemote:
    build:
      targets:
        HalcyonRemote: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HalcyonRemoteTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
