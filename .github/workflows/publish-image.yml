# Publishes the Docker image to GitHub Container Registry so people can run
# the store without cloning or building anything:
#
#   docker run -d --name halcyon --network host --restart unless-stopped \
#     ghcr.io/halcyon-video/halcyon-video
#
# Runs on release tags (vX.Y.Z) and by hand (workflow_dispatch). Multi-arch:
# amd64 + arm64 (NAS / Pi / Apple-silicon hosts).
#
# NOTE: the very first published package is PRIVATE by default — flip it to
# public once under the org's Packages → halcyon-video → settings, or pulls
# will 403.
name: Publish Docker image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: vX.Y.Z → X.Y.Z, X.Y and latest; manual runs tag the branch name.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
