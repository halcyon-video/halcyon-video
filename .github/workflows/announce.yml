# Cuts a GitHub Release — grouped notes plus, where possible, a store
# screenshot — and lands a matching CHANGELOG.md entry on master, with no
# human action, every time a version tag is pushed.
#
# Why this exists (issue #104): tags ran to v0.8.1 while the newest Release
# page still said v0.6.2 — Releases is the only subscribe button this project
# has, and fourteen versions shipped past it silently. The notes come from
# `tools/release-notes.mjs` (deterministic, offline, grouped from commit
# history — see that file for the rules); this workflow's only job is to run
# it and publish.
#
# THE SCREENSHOT IS BEST-EFFORT ON PURPOSE. The shooter (tools/shot.mjs) and
# the synthetic-library harness it drives are development scaffolding that is
# deliberately not part of this repository, so a public checkout does not have
# them. Every screenshot step below is therefore gated on the shooter actually
# being present and can never fail the release: notes are the deliverable, the
# picture is a bonus.
name: Announce a release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: announce-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release-notes.mjs walks the tag list and diffs `<prev-tag>..<tag>`,
          # so it needs the whole history, not the default single commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Is the screenshot harness in this checkout?
        id: harness
        run: |
          if [ -f tools/shot.mjs ]; then
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "::notice::tools/shot.mjs not in this checkout — publishing notes without a screenshot"
          fi

      # Only needed by the screenshot path: release-notes.mjs is pure node
      # stdlib, and puppeteer's Chromium download is the expensive part.
      - name: Install dependencies
        if: steps.harness.outputs.present == '1'
        run: npm ci

      - name: Generate release notes + CHANGELOG.md entry
        run: |
          node tools/release-notes.mjs \
            --to "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --changelog --release --out release-notes-body.md

      # Standing brand rule this repo's docs point at: a published screenshot
      # must come from a clone with no public/user-assets/ drop-ins. A fresh
      # checkout of the public repo never has that directory — this just skips
      # the shot loudly instead of ever publishing a branded one.
      - name: Guard against user-assets before shooting
        id: brandguard
        if: steps.harness.outputs.present == '1'
        run: |
          if [ -d public/user-assets ]; then
            echo "shoot=0" >> "$GITHUB_OUTPUT"
            echo "::warning::public/user-assets present in CI checkout — skipping the screenshot"
          else
            echo "shoot=1" >> "$GITHUB_OUTPUT"
          fi

      # Rotates through a small table of framings so the Releases feed isn't
      # the same picture fourteen times. Index = how many version tags exist
      # at this point, so each new release advances one step through the
      # table and wraps around — no state to store anywhere.
      - name: Pick this release's screenshot framing
        id: frame
        if: steps.brandguard.outputs.shoot == '1'
        run: |
          FRAMES=(
            "--state browse"
            "--state nrbrowse"
            "--full --lib 400 --series 0 --state promo --yaw 1"
            "--full --lib 400 --series 0 --state endcap"
            "--state clerk"
            "--state backroom"
            "--fly 1 --walk 11,110,0,3,16"
          )
          count=$(git tag --list 'v*' | wc -l)
          idx=$(( (count - 1) % ${#FRAMES[@]} ))
          echo "args=${FRAMES[$idx]}" >> "$GITHUB_OUTPUT"

      - name: Shoot the release screenshot
        if: steps.brandguard.outputs.shoot == '1'
        continue-on-error: true
        run: node tools/shot.mjs ${{ steps.frame.outputs.args }} --out release-shot.png

      - name: Commit the CHANGELOG.md entry to master
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged (entry already present), nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "CHANGELOG: ${{ github.ref_name }}"
          git push origin HEAD:master

      - name: Cut the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The screenshot is optional (see the header) — attach it only if a
          # shot actually landed.
          ASSETS=()
          if [ -f release-shot.png ]; then ASSETS+=(release-shot.png); fi
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes-body.md \
            "${ASSETS[@]}"
